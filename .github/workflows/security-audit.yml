name: Weekly vuln scan

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Run pnpm audit
        id: audit
        run: pnpm audit --audit-level=high --json > audit.json || echo "found=true" >> $GITHUB_OUTPUT

      - name: Open issue on findings
        if: steps.audit.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Weekly audit: vulnerabilities found',
              labels: ['security'],
              body: `Weekly vulnerability scan found high-severity (or above) advisories (run ${context.runId}).\n\nRun \`pnpm audit\` locally for details and check open Renovate PRs for fixes.`,
            });

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail_on_severity: high
