name: Update Artifacts

on:
  push:
    branches:
      - main
    paths-ignore:
      - audit.json
      - sbom.json
      - .github/badges/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Run audit and security badge
        run: pnpm run security:audit && pnpm run security:badge

      - name: Generate SBOM
        run: pnpm sbom --prod --sbom-format cyclonedx > sbom.json

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run coverage and badge
        run: pnpm test:coverage && pnpm run coverage:badge

      - name: Open artifacts PR
        id: artifacts-pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-artifacts
          commit-message: "chore: update artifacts"
          title: "chore: update artifacts"
          labels: dependencies
          delete-branch: true

      - name: Enable auto-merge on artifacts PR
        if: steps.artifacts-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.artifacts-pr.outputs.pull-request-number }}"
