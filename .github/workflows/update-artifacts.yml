name: Update Artifacts

on:
  push:
    branches:
      - main
    paths-ignore:
      - sbom.json
      - .github/badges/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Generate SBOM
        run: pnpm sbom --prod --sbom-format cyclonedx > sbom.json

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run coverage and badge
        run: pnpm test:coverage && pnpm run coverage:badge

      - name: Open artifacts PR
        id: artifacts-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-artifacts
          commit-message: "chore: update artifacts"
          title: "chore: update artifacts"
          labels: dependencies
          delete-branch: true

      - name: Best-effort update artifacts branch
        if: steps.artifacts-pr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/${{ github.repository }}/pulls/${{ steps.artifacts-pr.outputs.pull-request-number }}/update-branch --method PUT

      - name: Enable auto-merge on artifacts PR
        if: steps.artifacts-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash "${{ steps.artifacts-pr.outputs.pull-request-number }}"
