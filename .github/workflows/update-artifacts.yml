name: Update Artifacts

on:
  push:
    branches:
      - main
    paths-ignore:
      - sbom.json
      - .github/badges/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Generate SBOM
        run: pnpm sbom --prod --sbom-format cyclonedx > sbom.json

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run coverage and badge
        run: pnpm test:coverage && pnpm run coverage:badge

      - name: Open artifacts PR
        id: artifacts-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-artifacts
          commit-message: "chore: update artifacts"
          title: "chore: update artifacts"
          labels: dependencies
          delete-branch: true

      - name: Best-effort update artifacts branch
        if: steps.artifacts-pr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/${{ github.repository }}/pulls/${{ steps.artifacts-pr.outputs.pull-request-number }}/update-branch --method PUT

      - name: Enable auto-merge on artifacts PR
        if: steps.artifacts-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash "${{ steps.artifacts-pr.outputs.pull-request-number }}"
