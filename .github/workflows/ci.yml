name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/badges/coverage.json
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: 1. Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Check formatting
        run: pnpm run format:ci

  lint:
    name: 2. Lint
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Run lint
        run: pnpm run lint:ci

  formal:
    name: 3. Formal & Architecture
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1

      - name: Architecture ratchet
        run: node scripts/check-architecture.mjs

      - name: Cache TLA+ tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tla
          key: tla2tools-1.8.0-df7cef5d-37bcca87

      - name: TLA+ models (fixed passes, buggy must fail)
        run: bash scripts/check-formal.sh

      - name: Model-sync check
        env:
          MODEL_SYNC_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          node scripts/check-model-sync.mjs

  test:
    name: 4. Test
    runs-on: ubuntu-latest
    needs: formal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run tests
        run: pnpm test

  build:
    name: 5. Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Run build
        run: pnpm build

  status:
    name: CI Status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format
      - lint
      - formal
      - test
      - build
    steps:
      - name: Report result
        run: |
          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "CI failed at step 1: format"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "CI failed at step 2: lint"
            exit 1
          fi
          if [ "${{ needs.formal.result }}" != "success" ]; then
            echo "CI failed at step 3: formal & architecture"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI failed at step 4: test"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "CI failed at step 5: build"
            exit 1
          fi
          echo "CI passed: format, lint, test, and build completed in order"
