(*
Guards: src/voice/chatterbox.ts proc.on("close") handler.

The historical bug rejected pending requests only on a non-zero exit code. A
worker that shut itself down cleanly mid-request therefore left callers waiting
for a reply that could never arrive — a hang, not an error.

This config MUST fail TLC with NoDeadWorkerWithPending violated.
*)
SPECIFICATION Spec
CONSTANT Ids = {1, 2, 3}
CONSTANT FailOnlyOnNonZeroExit = TRUE
INVARIANT NoDeadWorkerWithPending
